# sonar-project.properties — gerado pelo Tommy (/tommy-start, opt-in).
# Substitua os placeholders [ENTRE_COLCHETES] antes da primeira análise.
# Sem servidor configurado, o quality gate trata o Sonar como SKIP (não bloqueante).

sonar.projectKey=[PROJECT_KEY]
sonar.projectName=[PROJECT_NAME]

# Servidor — descomente e preencha quando houver um servidor decidido:
# SonarCloud: sonar.host.url=https://sonarcloud.io + sonar.organization=<org>
# Self-hosted: sonar.host.url=https://sonar.suaempresa.com
# sonar.host.url=[SONAR_HOST_URL]
# sonar.organization=[SONAR_ORGANIZATION]

# Fontes e testes — derive de .tommy/codebase/structure.md:
sonar.sources=[SOURCES]
# sonar.tests=[TESTS]

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/vendor/**,**/.tommy/**

# Autenticação: NUNCA comite tokens — exporte SONAR_TOKEN no ambiente.
# A análise roda via .tommy/scripts/quality/sonar-run.sh (Gate 5 do tommy-quality-gate).
